<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 220" width="1280" height="220" role="img" aria-label="Antonio Neto — Backend & Systems">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="220" fill="url(#bg)"/>
  <rect width="1280" height="220" fill="url(#grid)" opacity="0.55"/>

  <!-- accent bar -->
  <rect x="0" y="0" width="6" height="220" fill="url(#accent)"/>

  <!-- decorative code brackets -->
  <g fill="none" stroke="#334155" stroke-width="1.2" opacity="0.5">
    <path d="M1120 40 L1090 110 L1120 180"/>
    <path d="M1180 40 L1210 110 L1180 180"/>
  </g>

  <!-- name -->
  <text x="60" y="92" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Inter, sans-serif" font-size="46" font-weight="700" fill="#e2e8f0" letter-spacing="0.5">
    Antonio Gomes Souza Neto
  </text>

  <!-- role -->
  <text x="60" y="128" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, monospace" font-size="18" fill="url(#accent)" filter="url(#glow)">
    backend · data · quantitative systems
  </text>

  <!-- tag chips -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#cbd5e1">
    <g transform="translate(60,160)">
      <rect width="86" height="26" rx="13" fill="#111827" stroke="#334155"/>
      <text x="43" y="17" text-anchor="middle">Python</text>
    </g>
    <g transform="translate(154,160)">
      <rect width="86" height="26" rx="13" fill="#111827" stroke="#334155"/>
      <text x="43" y="17" text-anchor="middle">FastAPI</text>
    </g>
    <g transform="translate(248,160)">
      <rect width="86" height="26" rx="13" fill="#111827" stroke="#334155"/>
      <text x="43" y="17" text-anchor="middle">React</text>
    </g>
    <g transform="translate(342,160)">
      <rect width="102" height="26" rx="13" fill="#111827" stroke="#334155"/>
      <text x="51" y="17" text-anchor="middle">TypeScript</text>
    </g>
    <g transform="translate(452,160)">
      <rect width="112" height="26" rx="13" fill="#111827" stroke="#334155"/>
      <text x="56" y="17" text-anchor="middle">PostgreSQL</text>
    </g>
    <g transform="translate(572,160)">
      <rect width="106" height="26" rx="13" fill="#111827" stroke="#334155"/>
      <text x="53" y="17" text-anchor="middle">SQLAlchemy</text>
    </g>
  </g>
</svg>
